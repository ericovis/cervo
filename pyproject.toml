[project]
name = "cervo"
version = "0.1.0"
description = "A demo app for managing static website hosting on a shared VPS"
readme = "README.md"
authors = [
    { name = "Eric Magalhães", email = "eric@plytz.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=3.4.7",
    "jinja2>=3.1.6",
    "pydantic[email]>=2.13.4",
    "python-decouple>=3.8",
]

[project.scripts]
cervo = "cervo:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
]

[tool.ruff.lint]
# Added on top of ruff's defaults, which are already broad — a plain `select`
# here would replace them and lint less. The exact ruff version is pinned in
# uv.lock, so the default set cannot shift until that is bumped.
# I isort, B bugbear, UP pyupgrade, SIM simplify, RUF ruff-specific.
extend-select = ["I", "B", "UP", "SIM", "RUF", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# A domain's dao is private to it. Everything else goes through its service.
"cervo.auth._dao".msg = "Use cervo.auth's service instead of reaching into its _dao."
"cervo.user._dao".msg = "Use cervo.user's service instead of reaching into its _dao."
"cervo.website._dao".msg = "Use cervo.website's service instead of reaching into its _dao."

[tool.ruff.lint.per-file-ignores]
# A domain's own service is the one thing allowed to call its dao.
"src/cervo/*/service.py" = ["TID251"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
