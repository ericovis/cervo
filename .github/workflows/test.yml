name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      # --locked fails rather than silently resolving, so a stale uv.lock is a
      # test failure instead of a surprise later.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      # No services: the suite points DATA_DIR at a tmp_path and replaces
      # mail.send, so it needs neither caddy nor mailcatcher.
      - name: Test
        run: uv run pytest
