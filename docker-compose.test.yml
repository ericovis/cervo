name: cervo-test

services:
  tests:
    build: .
    command: pytest
  # Nothing is bind-mounted in the test stack: code and tests run as baked
  # into the image, and there is no config file to mount any more.
  #
  # OAuth issuer URLs must be https or localhost, so the test stack keeps the
  # default DOMAIN=localhost and the smoke runner shares caddy's network
  # namespace: http://localhost reaches the front door, caddy's admin API is
  # http://localhost:2019, and the other services (app, mail) still resolve by
  # name through that namespace. The data volume is mounted so the runner can
  # drive the cervo-sync command against the same database the worker polls.
  smoke:
    build: .
    command: pytest -v tests/smoke.py
    network_mode: service:caddy
    volumes:
      - data:/mnt/data
    depends_on:
      - app
  app:
    build: .
    restart: unless-stopped
    # Two uvicorn workers, so the suite proves what makes several safe:
    # stateless MCP and SQLite in WAL — every request may land anywhere.
    environment:
      WEB_CONCURRENCY: 2
    volumes:
      - data:/mnt/data
    depends_on:
      - worker
      - caddy
      - mail
  worker:
    build: .
    command: cervo-worker
    restart: unless-stopped
    # Two polling threads, so the suite exercises concurrent claiming and
    # the one-at-a-time rule for the jobs that touch caddy's config.
    environment:
      WORKER_CONCURRENCY: 2
    volumes:
      - data:/mnt/data
  caddy:
    image: docker.io/library/caddy:latest
    restart: unless-stopped
    # Unprivileged as in production (the sysctl re-allows :80/:443), state in
    # /tmp. It boots with no config at all and serves nothing until the
    # worker's startup sync writes one — exactly as production does. It
    # starts after the worker so the cervo image is the one that seeds the
    # fresh named volume: mounted first by caddy, /mnt/data would be created
    # root-owned and locked against every unprivileged container.
    user: "1000:1000"
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 80
    command: caddy run --resume
    depends_on:
      - worker
    environment:
      CADDY_ADMIN: 0.0.0.0:2019
      XDG_DATA_HOME: /tmp/caddy
      XDG_CONFIG_HOME: /tmp/caddy
    volumes:
      - data:/mnt/data
  mail:
    image: docker.io/schickling/mailcatcher:latest

volumes:
  data:
