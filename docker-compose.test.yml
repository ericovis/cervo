name: cervo-test

services:
  tests:
    build: .
    command: pytest
  # OAuth issuer URLs must be https or localhost, so the test stack keeps the
  # default DOMAIN=localhost and the smoke runner shares caddy's network
  # namespace: http://localhost reaches the front door, and the other
  # services (app, mail) still resolve by name through that namespace.
  smoke:
    build: .
    command: pytest -v tests/smoke.py
    network_mode: service:caddy
    depends_on:
      - app
  app:
    build: .
    restart: unless-stopped
    volumes:
      - data:/mnt/data
    depends_on:
      - worker
      - caddy
      - mail
  worker:
    build: .
    command: cervo-worker
    restart: unless-stopped
    volumes:
      - data:/mnt/data
  # Seeding a stub Caddyfile keeps caddy from crash-looping on the fresh
  # volume: the smoke runner joins this container's network namespace, and a
  # restart while it joins kills the run. The worker's startup heal replaces
  # the stub through the admin API moments later.
  #
  # The list command form is load-bearing: a string command is word-split by
  # compose, which strips printf's backslashes and turns every \n into a
  # literal "n" — a one-line, unparseable Caddyfile that crash-loops caddy.
  # A list reaches the shell verbatim, so the newlines survive.
  caddy:
    image: caddy:latest
    command:
      - sh
      - -c
      - |
        test -f /mnt/data/Caddyfile || printf '%s\n' '{' 'admin 0.0.0.0:2019' '}' ':80' > /mnt/data/Caddyfile
        exec caddy run --config /mnt/data/Caddyfile --adapter caddyfile
    restart: unless-stopped
    volumes:
      - data:/mnt/data
  mail:
    image: schickling/mailcatcher:latest

volumes:
  data:
